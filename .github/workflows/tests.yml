name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Start WordPress environment
        run: npm run wp-env:start

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress test environment to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:8890 > /dev/null; do sleep 2; done'
          echo "WordPress is ready!"

      - name: Run unit tests
        working-directory: plugin
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps


      - name: Run E2E tests
        run: xvfb-run npm run test:e2e -- --reporter=list
        env:
          CI: true
          WP_BASE_URL: http://localhost:8890
